[project]
name = "jev-send-guard-agent"
version = "0.1.0"
description = "Cross-platform background agent: idle-based draft check against Jev, via OS accessibility APIs."
requires-python = ">=3.11"
dependencies = [
    "keyring>=25",
    "httpx>=0.27",
    "psutil>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
windows = [
    "uiautomation>=2.0.20; sys_platform == 'win32'",
]
macos = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[tool.uv]
package = false
